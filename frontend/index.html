<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>Smart Fish Pond — Monitoring Kolam Realtime</title>
  <meta name="description"
    content="Dashboard monitoring kualitas air kolam ikan: suhu, pH, oksigen terlarut, dan kekeruhan secara realtime." />
  <meta name="application-name" content="Smart Fish Pond" />
  <meta name="author" content="glacie21" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />

  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f0f5fa" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#060d1a" media="(prefers-color-scheme: dark)" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Smart Fish Pond" />
  <meta property="og:title" content="Smart Fish Pond — Monitoring Kolam Realtime" />
  <meta property="og:description"
    content="Pantau suhu, pH, oksigen terlarut, dan kekeruhan kolam ikan secara realtime." />
  <meta property="og:locale" content="id_ID" />
  <meta name="twitter:card" content="summary" />

  <!-- Tema tersimpan diterapkan sebelum render agar tidak ada kedipan tema salah.
       Logika yang sama ada di src/hooks/useTheme.js. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('fishpond.theme');
        var light = window.matchMedia('(prefers-color-scheme: light)').matches;
        document.documentElement.dataset.theme =
          saved === 'light' || saved === 'dark' ? saved : light ? 'light' : 'dark';
      } catch (e) { /* localStorage diblokir: pakai tema gelap bawaan */ }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />

  <!-- Splash mandiri selagi bundle React dimuat; diganti saat React render. -->
  <style>
    html { background: #060d1a; color: #e8f0fe; }
    html[data-theme='light'] { background: #f0f5fa; color: #0f172a; }
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; }
    .splash { display: grid; place-items: center; align-content: center; gap: 14px; min-height: 100vh; text-align: center; }
    .splash__logo { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 30%;
      background: linear-gradient(135deg, #0891b2, #22d3ee); color: #fff; animation: splash-pulse 1.6s ease-in-out infinite alternate; }
    .splash p { margin: 0; font-size: 13px; opacity: 0.65; }
    .splash__track { width: 140px; height: 3px; border-radius: 3px; overflow: hidden; background: rgba(125, 147, 178, 0.25); }
    .splash__track::after { content: ''; display: block; width: 40%; height: 100%; background: #22d3ee; animation: splash-glide 1.2s ease-in-out infinite; }
    .noscript { max-width: 420px; margin: 12vh auto; padding: 24px; text-align: center; }
    @keyframes splash-pulse { to { transform: scale(1.06); } }
    @keyframes splash-glide { from { transform: translateX(-100%); } to { transform: translateX(350%); } }
    @media (prefers-reduced-motion: reduce) { .splash__logo, .splash__track::after { animation: none; } }
  </style>
</head>

<body>
  <noscript>
    <div class="noscript">
      <h1>JavaScript dinonaktifkan</h1>
      <p>Dashboard Smart Fish Pond memerlukan JavaScript untuk menampilkan telemetri sensor secara realtime.</p>
    </div>
  </noscript>

  <div id="root">
    <div class="splash" role="status" aria-live="polite">
      <div class="splash__logo" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2.5S5.5 10 5.5 14.5a6.5 6.5 0 0 0 13 0C18.5 10 12 2.5 12 2.5z" />
        </svg>
      </div>
      <strong>Smart Fish Pond</strong>
      <div class="splash__track"></div>
      <p>Memuat sistem…</p>
    </div>
  </div>

  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
