<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Identitas halaman -->
    <title>Smart Fish Pond — Monitoring Kolam</title>
    <meta name="description" content="Dashboard monitoring kualitas air kolam ikan: suhu, pH, oksigen terlarut, dan kekeruhan secara realtime." />
    <meta name="application-name" content="Smart Fish Pond" />
    <meta name="author" content="glacie21" />

    <!-- Ikon: SVG inline agar tidak perlu aset tambahan -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23087f5b' d='M16 2.5S5.5 14 5.5 20a10.5 10.5 0 0 0 21 0c0-6-10.5-17.5-10.5-17.5z'/%3E%3Cpath fill='%23ffffff' opacity='.85' d='M12 19.5a4 4 0 0 0 4 4 1.2 1.2 0 0 1 0 2.4 6.4 6.4 0 0 1-6.4-6.4 1.2 1.2 0 0 1 2.4 0z'/%3E%3C/svg%3E"
    />

    <!-- Warna UI browser mengikuti token --bg pada styles/index.css -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3f7f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />

    <!-- Pratinjau saat ditautkan di chat/media sosial -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Smart Fish Pond" />
    <meta property="og:title" content="Smart Fish Pond — Monitoring Kolam" />
    <meta property="og:description" content="Pantau suhu, pH, oksigen terlarut, dan kekeruhan kolam ikan secara realtime." />
    <meta property="og:locale" content="id_ID" />
    <meta name="twitter:card" content="summary" />

    <!-- Font DM Sans dipakai body di styles/index.css -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap"
    />

    <!-- Gaya splash: berdiri sendiri karena index.css baru ikut saat bundel JS dimuat -->
    <style>
      :root {
        color-scheme: light dark;
        --splash-bg: #f3f7f4;
        --splash-text: #66776c;
        --splash-ring: #d5e1d8;
        --splash-accent: #087f5b;
        --splash-heading: #14251d;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --splash-bg: #0b1220;
          --splash-text: #94a3b8;
          --splash-ring: #26324a;
          --splash-heading: #e6edf7;
        }
      }

      html,
      body {
        margin: 0;
        background: var(--splash-bg);
      }

      .app-splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        min-height: 100vh;
        min-height: 100dvh;
        color: var(--splash-text);
        font-family: "DM Sans", "Segoe UI", sans-serif;
        font-size: 15px;
      }

      .app-splash__ring {
        width: 34px;
        height: 34px;
        border: 3px solid var(--splash-ring);
        border-top-color: var(--splash-accent);
        border-radius: 50%;
        animation: app-splash-spin 0.9s linear infinite;
      }

      @keyframes app-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-splash__ring {
          animation-duration: 2.4s;
        }
      }

      .app-noscript {
        max-width: 32rem;
        margin: 15vh auto 0;
        padding: 0 1rem;
        color: var(--splash-heading);
        font-family: "DM Sans", "Segoe UI", sans-serif;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <noscript>
      <div class="app-noscript">
        <h1>JavaScript dinonaktifkan</h1>
        <p>Dashboard Smart Fish Pond membutuhkan JavaScript untuk menampilkan data sensor secara realtime. Aktifkan JavaScript pada browser Anda, lalu muat ulang halaman ini.</p>
      </div>
    </noscript>

    <!-- Placeholder ini otomatis tergantikan saat React melakukan render pertama. -->
    <div id="root">
      <div class="app-splash" role="status" aria-live="polite">
        <div class="app-splash__ring"></div>
        <p>Memuat dashboard…</p>
      </div>
    </div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
