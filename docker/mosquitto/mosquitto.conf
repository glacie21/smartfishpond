# ============================================================
#  Konfigurasi Mosquitto
#
#  Autentikasi WAJIB: koneksi anonim ditolak. File password dibuat
#  otomatis oleh docker-entrypoint.sh dari:
#    - MQTT_BACKEND_PASSWORD / MQTT_SIMULATOR_PASSWORD di .env root
#    - docker/mosquitto/credentials (satu baris per device)
#  Hak akses topik diatur di file acl.
# ============================================================

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

# Berlaku untuk semua listener di bawah.
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# MQTT standar untuk device ESP32
listener 1883
protocol mqtt
# Client ID dipaksa sama dengan username, sehingga device lain tidak bisa
# memakai client ID milik device ini untuk menendangnya dari broker.
use_username_as_clientid true

# WebSocket — berguna bila dashboard perlu berlangganan broker langsung
listener 9001
protocol websockets
use_username_as_clientid true

# --- Produksi: TLS ---
# Taruh sertifikat di docker/mosquitto/certs/ (di-ignore git), lalu aktifkan
# blok berikut dan petakan port 8883 di docker-compose.yml. Setelah device
# beralih ke TLS, tutup port 1883 dari jaringan luar. Lihat docs/mqtt-topics.md.
#
# listener 8883
# protocol mqtt
# use_username_as_clientid true
# cafile   /mosquitto/setup/certs/ca.crt
# certfile /mosquitto/setup/certs/server.crt
# keyfile  /mosquitto/setup/certs/server.key
