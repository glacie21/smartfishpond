# ============================================================
#  Konfigurasi Mosquitto untuk pengembangan.
#
#  PERINGATAN: allow_anonymous true hanya untuk lingkungan lokal.
#  Untuk produksi, matikan anonim dan pakai password_file (lihat
#  bagian yang dikomentari di bawah) serta listener TLS pada 8883.
# ============================================================

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

# MQTT standar untuk device ESP32
listener 1883
protocol mqtt

# WebSocket — berguna bila dashboard perlu berlangganan broker langsung
listener 9001
protocol websockets

allow_anonymous true

# --- Produksi: aktifkan autentikasi ---
# allow_anonymous false
# password_file /mosquitto/config/passwd
#
# Membuat user:
#   docker exec -it fishpond-mosquitto \
#     mosquitto_passwd -c /mosquitto/config/passwd esp32-node-01
#
# --- Produksi: TLS ---
# listener 8883
# cafile   /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile  /mosquitto/certs/server.key
