; ============================================================
;  Smart Fish Pond IoT — Firmware Node Sensor (ESP32)
;  Docs: https://docs.platformio.org/page/projectconf.html
; ============================================================

[platformio]
default_envs = esp32dev

; Pengaturan bersama semua env ESP32 (env:native sengaja tidak mewarisinya).
[esp32_base]
platform = espressif32@^6.5.0
framework = arduino
board = esp32dev
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -Wall

[env:esp32dev]
extends = esp32_base

; Update via WiFi. Device harus satu jaringan dan OTA_PASSWORD terisi di
; secrets.h. Password tidak ditulis di sini agar tidak ikut ter-commit:
;   FISHPOND_OTA_PASSWORD=<password> pio run -e esp32dev-ota -t upload --upload-port <ip-device>
[env:esp32dev-ota]
extends = esp32_base
upload_protocol = espota
upload_port = 192.168.1.50   ; default; timpa dengan --upload-port
upload_flags =
    --auth=${sysenv.FISHPOND_OTA_PASSWORD}

; Unit test di komputer biasa (tanpa board): pio test -e native
; Hanya lib/PondMath yang dikompilasi — kode src/ butuh Arduino.
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -Wall
    -Wextra
